[package]
name = "oink-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "oink-sim"
path = "src/main.rs"

[dependencies]
oink-core = { path = "../oink-core" }
embedded-graphics.workspace = true
embedded-graphics-simulator = "0.8"
[target.'cfg(target_os = "macos")'.dependencies]
# macOS only: Homebrew ships sdl2-compat (SDL3-based), which emits events
# that crash the sdl2 crate. Build a real SDL2 statically there instead.
sdl2 = { version = "0.38", features = ["bundled", "static-link"] }
