[workspace]
resolver = "2"
members = ["oink-core", "oink-rulebook", "oink-sim", "oink-cli"]
# oink-m5paper is built separately with the espup toolchain (see Makefile)

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
bladeink = "2"
bladeink-compiler = "2"
embedded-graphics = "0.8"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
