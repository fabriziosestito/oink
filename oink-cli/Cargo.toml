[package]
name = "oink-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "oink command-line player: play a game bundle in the terminal"

[[bin]]
name = "oink"
path = "src/main.rs"

[dependencies]
oink-core = { path = "../oink-core" }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
viuer = { version = "0.11", features = ["icy_sixel"] }
